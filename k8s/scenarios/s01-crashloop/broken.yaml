apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  config.yaml: |
    port: 8080
    log_level: info
    database_url: "postgres://user:pass@db:5432/myapp"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting API server..."
              if [ ! -f /etc/app/config.yaml ]; then
                echo "ERROR: config file /etc/app/config.yaml not found" >&2
                exit 1
              fi
              echo "Config loaded: $(cat /etc/app/config.yaml)"
              echo "Server running on port 8080"
              sleep 3600
          volumeMounts:
            - name: config-volume
              mountPath: /etc/app
      volumes:
        - name: config-volume
          configMap:
            name: app-config-TYPO   # BUG: wrong ConfigMap name
