# Namespace quota — simulates a CoreWeave customer GPU allocation
apiVersion: v1
kind: ResourceQuota
metadata:
  name: customer-gpu-quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "4"           # Maximum 4 pods in this namespace
---
# Existing workload consuming the quota
apiVersion: apps/v1
kind: Deployment
metadata:
  name: existing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: existing-service
  template:
    metadata:
      labels:
        app: existing-service
    spec:
      containers:
        - name: svc
          image: nginx:1.25
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
---
# New training job — tries to create 4 pods but quota only allows 2 more
apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-workers
spec:
  replicas: 4   # BUG: with existing 2 pods using quota, only 2 more allowed
  selector:
    matchLabels:
      app: training-worker
  template:
    metadata:
      labels:
        app: training-worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
