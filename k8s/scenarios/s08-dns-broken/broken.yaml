# Backend service (in s08-backend namespace)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-api
  namespace: s08-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-api
  template:
    metadata:
      labels:
        app: model-api
    spec:
      containers:
        - name: api
          image: nginx:1.25
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: model-api-svc
  namespace: s08-backend
spec:
  selector:
    app: model-api
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
# Frontend pod (in s08-frontend) — tries to reach backend with wrong DNS name
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: s08-frontend
spec:
  restartPolicy: Never
  containers:
    - name: frontend
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Trying to reach backend..."
          # BUG: using wrong namespace in DNS name
          # Correct FQDN: model-api-svc.s08-backend.svc.cluster.local
          # Customer is using: model-api-svc.s08.svc.cluster.local (old namespace name)
          while true; do
            nslookup model-api-svc.s08.svc.cluster.local 2>&1 | head -5
            echo "---"
            sleep 10
          done
