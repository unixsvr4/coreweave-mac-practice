# Pod 1: Requests more GPUs than exist on any node
apiVersion: v1
kind: Pod
metadata:
  name: training-job-main
  labels:
    scenario: s05
spec:
  restartPolicy: Never
  containers:
    - name: trainer
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        limits:
          nvidia.com/gpu: "999"   # BUG: requesting 999 GPUs — impossible
          cpu: "4"
          memory: 16Gi
        requests:
          nvidia.com/gpu: "999"
          cpu: "4"
          memory: 16Gi
---
# Pod 2: nodeSelector for GPU type that doesn't exist in this cluster
apiVersion: v1
kind: Pod
metadata:
  name: training-job-worker
  labels:
    scenario: s05
spec:
  restartPolicy: Never
  containers:
    - name: trainer
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        limits:
          cpu: "2"
          memory: 8Gi
        requests:
          cpu: "2"
          memory: 8Gi
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-H200-SXM5-141GB   # BUG: no H200 nodes in cluster
