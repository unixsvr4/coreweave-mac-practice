apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  host: "postgres.databases.svc.cluster.local"
  port: "5432"
  password: "supersecret"
---
apiVersion: v1
kind: Pod
metadata:
  name: db-migration
  labels:
    app: db-migration
spec:
  restartPolicy: Never
  initContainers:
    # Init 1: Check if required secret exists (succeeds)
    - name: check-secrets
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Checking required secrets..."
          test -f /secrets/host && echo "  ✓ host" || { echo "  ✗ host missing"; exit 1; }
          test -f /secrets/password && echo "  ✓ password" || { echo "  ✗ password missing"; exit 1; }
          echo "All secrets present."
      volumeMounts:
        - name: db-creds
          mountPath: /secrets
          readOnly: true

    # Init 2: Wait for database to be ready (BUG: wrong host — DB doesn't exist)
    - name: wait-for-db
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Waiting for database to be ready..."
          DB_HOST=$(cat /secrets/host)
          DB_PORT=$(cat /secrets/port 2>/dev/null || echo "5432")
          echo "Connecting to ${DB_HOST}:${DB_PORT}..."
          # BUG: host is "postgres.databases.svc.cluster.local" which doesn't exist in this ns
          until nc -z -w 3 ${DB_HOST} ${DB_PORT} 2>/dev/null; do
            echo "  Database not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "Database is ready!"
      volumeMounts:
        - name: db-creds
          mountPath: /secrets
          readOnly: true

  containers:
    - name: migration
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Running database migrations..."
          echo "Migration complete!"
          sleep 10
      volumeMounts:
        - name: db-creds
          mountPath: /secrets
          readOnly: true

  volumes:
    - name: db-creds
      secret:
        secretName: db-credentials
