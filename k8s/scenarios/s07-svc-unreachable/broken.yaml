apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-api
      version: v2
  template:
    metadata:
      labels:
        app: inference-api
        version: v2
    spec:
      containers:
        - name: api
          image: nginx:1.25   # nginx listens on port 80
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inference-api-svc
spec:
  selector:
    app: inference-api    # BUG 1: missing version: v2 label — wait, this would still work
    version: v1           # BUG 1: version label is v1 but pods have v2 → no endpoints
  ports:
    - name: http
      port: 80
      targetPort: 8080    # BUG 2: nginx listens on 80, not 8080
  type: ClusterIP
