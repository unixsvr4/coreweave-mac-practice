global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'namespace']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty'
      continue: true
    - match:
        team: platform
      receiver: 'platform-team'

receivers:
  - name: 'default'
    # webhook_configs:
    #   - url: 'http://slack-webhook/...'

  - name: 'pagerduty'
    # pagerduty_configs:
    #   - routing_key: 'your-pagerduty-key'

  - name: 'platform-team'
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/...'
    #     channel: '#platform-alerts'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'node']
