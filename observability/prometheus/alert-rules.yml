groups:
  - name: kubernetes-critical
    interval: 30s
    rules:
      # Pod crash-looping
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 > 0
        for: 5m
        labels:
          severity: critical
          team: support
        annotations:
          summary: "Pod {{ $labels.pod }} is crash-looping"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been restarting for 5+ minutes. Check: kubectl logs {{ $labels.pod }} -n {{ $labels.namespace }} --previous"

      # Pod OOMKilled
      - alert: PodOOMKilled
        expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        for: 1m
        labels:
          severity: warning
          team: support
        annotations:
          summary: "Pod {{ $labels.pod }} was OOMKilled"
          description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} was killed by the OOM killer. Consider increasing memory limits."

      # Pods stuck Pending
      - alert: PodStuckPending
        expr: kube_pod_status_phase{phase="Pending"} == 1
        for: 10m
        labels:
          severity: warning
          team: support
        annotations:
          summary: "Pod {{ $labels.pod }} stuck Pending for 10+ minutes"
          description: "Check: kubectl describe pod {{ $labels.pod }} -n {{ $labels.namespace }} — look at Events section for scheduler message."

      # Deployment has unavailable replicas
      - alert: DeploymentReplicasUnavailable
        expr: kube_deployment_status_replicas_unavailable > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.deployment }} has {{ $value }} unavailable replicas"

  - name: nodes-critical
    rules:
      # Node not ready
      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Node {{ $labels.node }} is NOT Ready"
          description: "Node has been NotReady for 2+ minutes. Check: kubectl describe node {{ $labels.node }}"

      # Node memory pressure
      - alert: NodeMemoryPressure
        expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
        for: 2m
        labels:
          severity: critical
          team: support
        annotations:
          summary: "Node {{ $labels.node }} has MemoryPressure"

      # Host CPU high
      - alert: HostHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host {{ $labels.instance }} CPU above 90%"

      # Host memory low
      - alert: HostMemoryLow
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host {{ $labels.instance }} has < 10% memory available"

      # Disk almost full
      - alert: HostDiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.device }} on {{ $labels.instance }} is {{ $value | humanize }}% full"

  - name: gpu-alerts
    rules:
      # GPU utilization very low (training job not using GPUs — wasted capacity)
      - alert: GPUUnderutilized
        expr: DCGM_FI_DEV_GPU_UTIL < 20
        for: 15m
        labels:
          severity: warning
          team: support
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.node }} has < 20% utilization for 15+ minutes"
          description: "Customer may have a data loading bottleneck or CUDA initialization issue."

      # GPU temperature high (thermal throttling risk)
      - alert: GPUHighTemperature
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "GPU {{ $labels.gpu }} temperature is {{ $value }}°C"

      # GPU memory almost full
      - alert: GPUMemoryHigh
        expr: (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE)) * 100 > 90
        for: 5m
        labels:
          severity: warning
          team: support
        annotations:
          summary: "GPU {{ $labels.gpu }} memory is {{ $value | humanize }}% used — approaching OOM"

  - name: storage-alerts
    rules:
      # PVC not bound
      - alert: PVCNotBound
        expr: kube_persistentvolumeclaim_status_phase{phase!="Bound"} == 1
        for: 5m
        labels:
          severity: warning
          team: support
        annotations:
          summary: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is {{ $labels.phase }}"
          description: "Check: kubectl describe pvc {{ $labels.persistentvolumeclaim }} -n {{ $labels.namespace }}"
